<title>Replays Vastu</title>
<style>
:root {
  --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#16213e;
  --accent:#e2b96f; --accent2:#c9956a;
  --text:#e8e0d4; --muted:#9a8f82;
  --border:#2a2a45; --hover:#252540; --tag:#1e1e35;
  --link:#7eb8d4; --r:10px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body { font-family:-apple-system,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }

/* ── HEADER ── */
header {
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border-bottom:1px solid var(--border);
  padding:14px 16px 12px;
  flex-shrink:0;
}
.header-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.logo { font-size:26px; flex-shrink:0; }
h1 { font-size:16px; font-weight:700; color:var(--accent); line-height:1.3; }
h1 span { display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:2px; }
.search-wrap { position:relative; }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
#search {
  width:100%; padding:11px 14px 11px 40px;
  background:var(--bg); border:1.5px solid var(--border);
  border-radius:var(--r); color:var(--text); font-size:16px;
  outline:none; transition:border-color .2s;
  -webkit-appearance:none; appearance:none;
}
#search:focus { border-color:var(--accent); }
#search::placeholder { color:var(--muted); }
.stats { font-size:11px; color:var(--muted); margin-top:8px; }
.stats strong { color:var(--accent); }

/* ── CATEGORIES ── */
.cats-wrap {
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  padding:10px 0;
  flex-shrink:0;
  overflow:hidden;
}
.cats-scroll {
  display:flex; gap:7px;
  overflow-x:auto; overflow-y:hidden;
  padding:2px 16px 6px;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}
.cats-scroll::-webkit-scrollbar { display:none; }
.cat-btn {
  display:inline-flex; align-items:center; gap:5px;
  background:var(--tag); border:1.5px solid var(--border);
  color:var(--muted); padding:0 12px;
  height:36px; border-radius:18px;
  font-size:13px; cursor:pointer; white-space:nowrap;
  transition:all .15s; touch-action:manipulation;
  flex-shrink:0; scroll-snap-align:start;
  font-family:inherit;
  -webkit-user-select:none; user-select:none;
}
.cat-btn:active { transform:scale(0.96); opacity:.8; }
.cat-btn.active { background:var(--accent); border-color:var(--accent); color:#1a1a2e; font-weight:700; }
.cat-btn .badge {
  background:rgba(0,0,0,.2); border-radius:10px;
  padding:1px 6px; font-size:11px;
}
.cat-btn.active .badge { background:rgba(0,0,0,.25); }
#btn-all {
  background:var(--surface); border:1.5px solid var(--accent);
  color:var(--accent); font-weight:700;
}
#btn-all.active { background:var(--accent); color:#1a1a2e; }

/* ── SCROLL AREA ── */
#scroll-area {
  flex:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:16px;
}

/* ── GROUPS ── */
.group { margin-bottom:24px; }
.group-header {
  display:flex; align-items:center; gap:7px;
  margin-bottom:10px; padding-bottom:8px;
  border-bottom:1px solid var(--border); position:sticky; top:-1px;
  background:var(--bg); padding-top:4px; z-index:1;
}
.group-icon { font-size:17px; }
.group-title { font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.6px; text-transform:uppercase; flex:1; }
.group-count { font-size:11px; color:var(--muted); background:var(--tag); padding:2px 7px; border-radius:10px; }

/* ── CARDS ── */
.cards { display:flex; flex-direction:column; gap:8px; }
@media(min-width:700px) {
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
}
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:13px 14px;
  display:flex; flex-direction:column; gap:7px;
  transition:border-color .15s;
}
.card-title { font-size:14px; font-weight:500; color:var(--text); line-height:1.45; }
.card-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.card-date { font-size:11px; color:var(--muted); }
.card-time {
  font-size:11px; color:var(--accent2);
  background:rgba(201,149,106,.1); padding:2px 7px; border-radius:8px;
}
.card-link {
  display:inline-flex; align-items:center; gap:5px;
  font-size:13px; color:var(--link); text-decoration:none;
  padding:8px 14px;
  background:rgba(126,184,212,.08); border:1px solid rgba(126,184,212,.2);
  border-radius:8px; transition:all .15s; align-self:flex-start;
  touch-action:manipulation; min-height:36px;
  -webkit-user-select:none; user-select:none;
}
.card-link:active { opacity:.7; }
.card-nolink { font-size:11px; color:var(--muted); font-style:italic; }

/* ── EMPTY ── */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty .icon { font-size:44px; margin-bottom:12px; }

mark { background:rgba(226,185,111,.25); color:var(--accent); border-radius:2px; }
</style>
</head>

const CATS = ["CAS PRATIQUES VASTU", "CAS PRATIQUE PURUSHA MANDALAS", "CONSULTANT VASTU :  ETHIQUE ET POSITIONNEMENT", "CONTENU DEVIS", "FINANCES", "MANDALAS", "MARMATHERAPIE", "MEMOIRES DES LIEUX", "METHODES DE CORRECTION", "OUTILS PEDAGOGIQUES DU CONSULTANT", "PARCOURS CERTIFICATION", "PSYCHOLOGIE", "PHILOSOPHIE DU VASTU", "SYMBOLES ET DIVINITÉS", "Vénus 203 / Archétype de la Persona, du masque social (Yung)", "TECHNIQUE ET SUJETS DE COURS", "VENTES ET COMMUNICATION", "VIE SPIRITUELLE", "QUESTIONS / REPONSES"];
const ICONS = {"CAS PRATIQUES VASTU": "🏠", "CAS PRATIQUE PURUSHA MANDALAS": "🔵", "CONSULTANT VASTU :  ETHIQUE ET POSITIONNEMENT": "⚖️", "CONTENU DEVIS": "📋", "FINANCES": "💰", "MANDALAS": "🌀", "MARMATHERAPIE": "🙌", "MEMOIRES DES LIEUX": "👁️", "METHODES DE CORRECTION": "🔧", "OUTILS PEDAGOGIQUES DU CONSULTANT": "🎓", "PARCOURS CERTIFICATION": "🏆", "PSYCHOLOGIE": "🧠", "PHILOSOPHIE DU VASTU": "📿", "SYMBOLES ET DIVINITÉS": "✨", "Vénus 203 / Archétype de la Persona, du masque social (Yung)": "♀️", "TECHNIQUE ET SUJETS DE COURS": "📐", "VENTES ET COMMUNICATION": "📣", "VIE SPIRITUELLE": "🕊️", "QUESTIONS / REPONSES": "❓"};

let activeCat = null;
let searchVal = '';

function filterCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    const isAll = b.id === 'btn-all';
    b.classList.toggle('active', cat === null ? isAll : b.dataset.cat === cat);
  });
  // Scroll le bouton actif en vue
  const active = document.querySelector('.cat-btn.active');
  if (active) active.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  render();
}

function hl(text, q) {
  if (!q) return text;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function render() {
  const q = searchVal.toLowerCase().trim();
  const main = document.getElementById('main');

  const filtered = ENTRIES.filter(e => {
    if (activeCat && e.cat !== activeCat) return false;
    if (!q) return true;
    return e.titre.toLowerCase().includes(q) || e.cat.toLowerCase().includes(q) || (e.date && e.date.includes(q));
  });

  const groups = {};
  filtered.forEach(e => { (groups[e.cat] = groups[e.cat] || []).push(e); });
  const nCats = Object.keys(groups).length;

  document.getElementById('stats').innerHTML =
    `Affichage de <strong>${filtered.length}</strong> extraits dans <strong>${nCats}</strong> catégorie${nCats > 1 ? 's' : ''}`;

  if (!filtered.length) {
    main.innerHTML = '<div class="empty"><div class="icon">🔍</div><p>Aucun résultat</p></div>';
    return;
  }

  main.innerHTML = CATS.filter(c => groups[c]).map(cat => {
    const items = groups[cat];
    const icon = ICONS[cat] || '📌';
    const cards = items.map(e => {
      const timeBadge = e.debut ? `<span class="card-time">⏱ ${e.debut}${e.fin ? ' → ' + e.fin : ''}</span>` : '';
      const dateBadge = e.date ? `<span class="card-date">📅 ${e.date}</span>` : '';
      const link = e.lien
        ? `<a class="card-link" href="${e.lien}" target="_blank" rel="noopener">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
             Ouvrir le replay</a>`
        : '<span class="card-nolink">Lien non disponible</span>';
      return `<div class="card">
        <div class="card-title">${hl(e.titre, q)}</div>
        <div class="card-meta">${dateBadge}${timeBadge}</div>
        ${link}
      </div>`;
    }).join('');
    return `<div class="group">
      <div class="group-header">
        <span class="group-icon">${icon}</span>
        <span class="group-title">${cat}</span>
        <span class="group-count">${items.length}</span>
      </div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join('');

  document.getElementById('scroll-area').scrollTop = 0;
}

// Écouter les clics sur les boutons catégorie (délégation d'événement)
document.getElementById('cats-scroll').addEventListener('click', function(e) {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  if (btn.id === 'btn-all') { filterCat(null); }
  else { filterCat(btn.dataset.cat); }
});

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value;
  render();
});

render();
</script>
